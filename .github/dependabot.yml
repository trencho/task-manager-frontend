version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Skopje
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      # vitest and its coverage provider peer each other at an EXACT version -- @vitest/coverage-v8
      # requests `vitest: "5.0.0"`, not a range -- so they have to move in the same PR on every
      # release, majors included. This group is listed FIRST and carries no update-types filter,
      # because a group that omits the filter takes every update type; minor-and-patch below would
      # otherwise leave the major path ungrouped, which is the case that splits them.
      #
      # What a split costs, measured on 2026-09-06 rather than assumed: Yarn reports the unmet
      # exact peer as YN0060/YN0086 WARNINGS, so `yarn install --immutable` exits 0, and lint,
      # type-check, test and build all pass. Only `yarn coverage` fails, reporting 0% of 239
      # statements -- and that was the one command CI did not run. The Test step now runs coverage
      # for that reason; the two fixes are deliberate belt and braces.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      # One PR per week for the routine bumps, instead of five that each need a CI run.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node tracks the RUNTIME major, always -- typings for a Node the project does not run
      # describe APIs that are not there. It reached 26.2.0 while the image was briefly on Node 26;
      # both are back on 24. Same release condition as the image, so the two lift together.
      # lift-when: eol-lts nodejs 26
      - dependency-name: "@types/node"
        versions: [">=25"]
      #
      # The eslint / eslint-plugin-vue major holds were LIFTED on 2026-08-16, their release
      # condition having been met: the repo is on eslint 10.8.1 with eslint-plugin-vue 10.10.0,
      # whose peer range is `^8.57.0 || ^9.0.0 || ^10.0.0`. Left in place they had stopped
      # describing the 9 -> 10 move they were written for and started blocking 11 -- a hold
      # whose reason has expired keeps working perfectly, which is exactly the problem.
      #
      # TypeScript 7 is the native-compiler rewrite and is blocked upstream, not deferred by
      # preference: typescript-eslint peers `typescript >=4.8.4 <6.1.0`, so no released version
      # supports it, and Yarn's builtin typescript compat patch breaks on the native compiler.
      # Without this, Dependabot reopens a PR that cannot pass (it already did once, #14), and a
      # permanently-red PR is noise that hides the red that matters.
      #
      # Lift it when typescript-eslint ships TS 7 support, moving the toolchain together
      # (typescript, typescript-eslint, vue-tsc) rather than this pin alone. The other three
      # TypeScript repos here hold the same major the same way.
      - dependency-name: "typescript"
        update-types: [version-update:semver-major]
        # lift-when: npm-peer typescript-eslint allows typescript >=7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Skopje
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Skopje
    commit-message:
      prefix: chore
    # No update-type restriction: majors, minors and patches all flow, and the guard that matters
    # for images -- blocking a RELEASE-CANDIDATE tag -- lives in dependabot-auto-merge.yml instead.
    # It has to: `docker` matches TAGS, which carry no release-channel metadata, so
    # `python:3.14.6-slim` -> `python:3.15.0rc1-slim` scores an ordinary MINOR, and
    # `ignore.versions` takes version RANGES rather than globs (dependabot-core#15154), so
    # "no pre-releases" cannot be written here at all.
    #
    # ONE CARVE-OUT: the RUNTIME image tracks the current LTS, per
    # references/runtime-lts-policy.md. The same missing tag metadata means Dependabot cannot tell
    # an LTS major from a Current one -- node:24 -> node:26 scored an ordinary major and merged a
    # NON-LTS runtime into this image on 2026-08-16, two months before Node 26's LTS date, with CI
    # green because CI was still installing Node 24. Major-only: patches within the 24 line still
    # flow.
    #
    # SECOND CARVE-OUT, added 2026-09-06. This block used to say nginx was "deliberately NOT held --
    # it has its own support policy, not an LTS line". The first half is true and the conclusion did
    # not follow: nginx has no LTS line, but it does run TWO branches at once, and a docker tag
    # cannot tell them apart any more than it can tell an LTS major from a Current one.
    #
    # nginx numbers its STABLE branch with EVEN minors and its MAINLINE branch with ODD ones
    # (nginx.org/en/download.html: 1.24.0, 1.26.3, 1.28.3, 1.30.4 are the settled stable series;
    # 1.31.5 is the live mainline). So `1.30-alpine` -> `1.31-alpine` is not an upgrade, it is a
    # branch change, and it scores as an ordinary MINOR -- the same shape as the node:24 -> node:26
    # bump above.
    #
    # This repo served from `1.31-alpine` -- MAINLINE -- between 2026-07-11 and 2026-09-06. It got
    # there by auto-merging exactly that bump, while the sibling frontend declined the identical PR
    # and wrote down why. The serve stage is back on `1.30-alpine` and the hold blocks `>=1.31`, so
    # the branch it sits on is now the one the config says it should be on. Patches inside 1.30
    # arrive by tag movement and are unaffected.
    #
    # `ignore.versions` takes version RANGES rather than globs, so "odd minors" is inexpressible;
    # holding above the next stable minor is the same rule in a form the config has.
    ignore:
      # lift-when: eol-lts nodejs 26
      - dependency-name: "node"
        versions: [">=25"]
      # lift-when: manual nginx 1.32 (the next STABLE, even-numbered minor) is released; then move
      # the Dockerfile to 1.32-alpine and re-set this hold to >=1.33.
      - dependency-name: "nginx"
        versions: [">=1.31"]

  # Compose files -- a SEPARATE ecosystem from `docker`, which does NOT cover them. Before this
  # block existed the image tags in these files were updated by nothing at all, because
  # `docker` was configured and containers read as handled.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Skopje
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
