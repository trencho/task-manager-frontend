name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint + test + build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Activate the Corepack-pinned Yarn (package.json "packageManager") before setup-node,
      # so its cache: yarn step can resolve Yarn's cache folder. Uses the runner's Node.
      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      # `--immutable` installs exactly the committed yarn.lock and fails if package.json and
      # the lockfile disagree. A plain `yarn install` would quietly rewrite the lockfile.
      - name: Install
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      # vue-tsc is the type gate; Vite/Vitest transpile TS but do not type-check it.
      - name: Type-check
        run: yarn type-check

      # Why this is its own gate: the suite once silently ran ZERO tests for months. That was
      # under Jest -- it resolved testEnvironment 'jsdom' to a jest-environment-jsdom major its
      # constructor could not load, every suite failed to load, and nobody ran it. The history is
      # kept because it is what justifies the gate; the runner is not.
      #
      # Vitest now: it exits non-zero when no test files match, so the same collapse is caught
      # here rather than passing as an empty green run.
      #
      # This runs `coverage` rather than `test`. Same 94 tests, and it additionally exercises the
      # coverage provider, which nothing else here does. Measured on 2026-09-06: with vitest and
      # @vitest/coverage-v8 on different majors, install (even --immutable), lint, type-check,
      # test and build ALL pass while `yarn coverage` fails and reports 0% of 239 statements. The
      # one command that could see the breakage was the one command CI did not run.
      - name: Test
        run: yarn coverage

      - name: Build
        run: yarn build

      # The Dockerfile is the one artifact nothing here exercised. `yarn build` proves the bundle
      # compiles; it says nothing about whether an image can be produced from it. The sibling backend
      # shipped a Dockerfile that could not build at all for months for exactly that reason -- a flag
      # its base image had removed -- and no test, lint or build step could have seen it.
      #
      # No push and no registry login: this repo publishes no images. The step exists so a broken
      # Dockerfile fails on the PR that breaks it rather than the next time someone needs an image.
      # VITE_API_URL is left unset on purpose, which is the same-origin default the README documents.
      - name: Build the container image
        run: docker build -t task-manager-vue:ci .
